    <circle cx="726" cy="152" r="8" fill="#c9a34e"/>
    <path d="M 750 152 H 990" stroke="#f7f3e8" stroke-opacity="0.42" stroke-width="4" stroke-linecap="round"/>
    <text x="724" y="246" fill="#f7f3e8" fill-opacity="0.72" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">SIGNAL</text>
    <text x="724" y="188" fill="#f7f3e8" font-family="Arial, sans-serif" font-size="25" font-weight="700">One clearer decision</text>
  </g>
  <g opacity="0.92">
    <rect x="790" y="315" width="330" height="154" rx="18" fill="#16243d" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="832" cy="363" r="22" fill="none" stroke="#c9a34e" stroke-width="2"/>
    <path d="M 823 363 L 830 370 L 843 354" fill="none" stroke="#c9a34e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="872" y="358" fill="#f7f3e8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Develop</text>
    <text x="872" y="389" fill="#c1cad7" font-family="Arial, sans-serif" font-size="14">Turn insight into practice</text>
    <path d="M 832 414 H 1070" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="832" y="428" width="184" height="7" rx="3.5" fill="#c9a34e" fill-opacity="0.72"/>
    <rect x="1022" y="428" width="48" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.16"/>
  </g>
  <g opacity="0.95">
    <rect x="650" y="525" width="430" height="176" rx="18" fill="#0d1a2f" fill-opacity="0.88" stroke="#c9a34e" stroke-opacity="0.2"/>
    <text x="690" y="570" fill="#c9a34e" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" font-weight="700">MOMENTUM</text>
    <text x="690" y="612" fill="#f7f3e8" font-family="Arial, sans-serif" font-size="27" font-weight="700">Action becomes visible.</text>
    <g fill="none" stroke="#c9a34e" stroke-opacity="0.55">
      <circle cx="1010" cy="610" r="42"/>
      <circle cx="1010" cy="610" r="24" stroke-opacity="0.28"/>
