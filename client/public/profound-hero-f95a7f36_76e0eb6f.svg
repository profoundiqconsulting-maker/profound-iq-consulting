<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Abstract pathway from insight to action">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.55" stop-color="#101d35"/>
      <stop offset="1" stop-color="#1b3152"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d6f25"/>
      <stop offset="0.5" stop-color="#c9a34e"/>
      <stop offset="1" stop-color="#f0d477"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#c9a34e" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#c9a34e" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0b1730" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#field)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="980" cy="170" r="260" fill="#c9a34e" opacity="0.07" filter="url(#soft)"/>
  <path d="M 610 650 C 700 520 760 548 835 430 S 970 250 1110 190" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 13" opacity="0.82"/>
  <path d="M 610 650 C 700 520 760 548 835 430 S 970 250 1110 190" fill="none" stroke="#f7f3e8" stroke-opacity="0.16" stroke-width="16" filter="url(#soft)"/>
  <g opacity="0.95">
    <rect x="690" y="112" width="390" height="154" rx="18" fill="url(#panel)" stroke="#c9a34e" stroke-opacity="0.34"/>
