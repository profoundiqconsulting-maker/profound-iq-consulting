    <path d="M 989 610 L 1004 625 L 1035 589" fill="none" stroke="#f0d477" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="690" y="664" fill="#8f9db3" font-family="Arial, sans-serif" font-size="14">A practical next step, measured and refined.</text>
  </g>
  <g fill="#c9a34e">
    <circle cx="610" cy="650" r="7"/>
    <circle cx="835" cy="430" r="7"/>
    <circle cx="1110" cy="190" r="7"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12">
    <path d="M 0 690 H 560"/>
    <path d="M 0 720 H 480"/>
    <path d="M 0 750 H 590"/>
  </g>
  <text x="42" y="748" fill="#8f9db3" font-family="Arial, sans-serif" font-size="14" letter-spacing="4">PROFOUND IQ / EXECUTIVE SIGNAL</text>
